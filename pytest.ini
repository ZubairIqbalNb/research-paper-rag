[pytest]
# Make both the project root (main.py, backend/) and tests/ (test doubles)
# importable regardless of how pytest is invoked.
pythonpath = . tests
testpaths = tests
markers =
    slow: end-to-end tests that load the real Sentence Transformer / cross-encoder models
    live: tests that call the real Gemini API (skipped unless GEMINI_API_KEY is set)
